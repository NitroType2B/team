name: Update team stats
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-team-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update.mjs
      - name: Save changes
        run: |
          git config user.name "team-bot"
          git config user.email "team-bot@users.noreply.github.com"
          git add data.json debug.json snapshots.json
          if ! git diff --staged --quiet; then
            git commit -m "Update team stats"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
