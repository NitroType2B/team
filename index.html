<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pit Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101828;--mute:#667085;--paper:#F5F6FA;--card:#fff;--line:#E3E6EE;--blue:#2F5BFF;--gold:#F5B301;--goldname:#C98A00;--green:#12805C;--red:#C0362C;--stripe:rgba(16,24,40,.04)}
@media (prefers-color-scheme:dark){:root{--ink:#EEF1F8;--mute:#98A2B3;--paper:#0E1320;--card:#161C2C;--line:#262E44;--blue:#6C8BFF;--goldname:#F5B301;--green:#4CC9A0;--red:#FF8077;--stripe:rgba(255,255,255,.04)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.banner{background:var(--gold);color:#101828;padding:10px 16px;font-weight:600;text-align:center}
/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth-box{width:100%;max-width:380px}
.auth h1{font-size:44px;line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.03em}
.auth p{color:var(--mute);margin:0 0 24px}
form.stack{display:grid;gap:12px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600}
.err{color:var(--red);min-height:1.4em;margin:0;font-size:14px}
/* header + pages */
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
nav{display:flex;gap:4px}
nav a{padding:8px 14px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600}
nav a[aria-current="page"]{background:var(--paper);color:var(--ink)}
header .who{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px}
main{padding:24px;max-width:1200px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.head h3{margin:0;font-size:16px}
.scroll{overflow:auto;flex:1;min-height:0}
/* racers table */
table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:4px;width:100%;padding:12px 14px;cursor:pointer}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
th .arrow{font-size:10px;opacity:.9}
th[aria-sort] button{color:var(--ink)}
th:first-child button{padding-left:40px}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:nth-child(even) td{background:var(--stripe)}
tr:last-child td{border-bottom:0}
td.first{position:relative;padding-left:40px}
.tag{position:absolute;left:0;top:0;bottom:0;width:24px;display:grid;place-items:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.tag.officer{background:#2A7BC8;color:#fff}
.tag.captain{background:var(--gold);color:#101828}
.who-cell{display:flex;align-items:center;gap:12px}
.car{width:84px;height:36px;object-fit:contain;flex:none}
.car.none{display:grid;place-items:center;color:var(--mute);font-size:12px;border:1px dashed var(--line);border-radius:8px}
.uname{font-weight:800;display:flex;align-items:center;gap:8px}
.uname a{color:inherit;text-decoration:none}.uname a:hover{text-decoration:underline}
.uname.gold a{color:var(--goldname)}
.sub{color:var(--mute);font-size:12px;font-style:italic}
.gain{color:var(--green);font-size:12px;font-weight:600}
.nt{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--gold);color:#101828;font-size:11px;font-weight:800;flex:none}
.place{font-size:12px;font-weight:800;border-radius:6px;padding:1px 7px;color:#101828}
.place.p1{background:#F5B301}.place.p2{background:#C3CAD6}.place.p3{background:#D9955A}
.updated{color:var(--mute);font-size:12px;font-weight:400}
.empty{padding:28px 20px;color:var(--mute)}
/* chat */
#chat{height:calc(100vh - 190px);min-height:420px}
.msg{padding:8px 20px}
.msg b{font-size:13px}
.msg time{color:var(--mute);font-size:12px;margin-left:6px}
.msg p{margin:2px 0 0;overflow-wrap:anywhere}
.msg.me b{color:var(--blue)}
.send{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="setup" class="banner hidden">Paste your Firebase apiKey into the firebaseConfig near the bottom of this file.</div>

<div id="auth" class="auth hidden">
  <div class="auth-box">
    <h1>Team Pit Stop</h1>
    <p>Chat with your team and see who is racing the most.</p>
    <form id="authForm" class="stack">
      <input id="username" placeholder="Nitro Type username" autocomplete="nickname" class="hidden">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn" id="authBtn" type="submit">Sign in</button>
    </form>
    <p style="margin-top:16px"><span id="swapText">New here?</span> <button class="link" id="swap" type="button">Create an account</button></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h2>Team Pit Stop</h2>
    <nav aria-label="Pages">
      <a href="#stats" id="navStats">Team stats</a>
      <a href="#chat" id="navChat">Chat</a>
    </nav>
    <div class="who"><span id="me"></span><button class="btn ghost" id="out">Sign out</button></div>
  </header>
  <main>
    <section id="statsView">
      <div class="head">
        <h3>Team racers</h3>
        <span class="updated" id="updated"></span>
      </div>
      <div class="scroll" id="racers"></div>
    </section>
    <section id="chat" class="hidden">
      <div class="head"><h3>Team chat</h3></div>
      <div class="scroll" id="msgs"></div>
      <form class="send" id="sendForm">
        <input id="text" placeholder="Write a message" maxlength="500" autocomplete="off" required>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDj-UlpMjTVccy4RfWqP8-Lyt_2HOFs4lc",
  authDomain: "nitrotype2b.firebaseapp.com",
  projectId: "nitrotype2b",
  storageBucket: "nitrotype2b.firebasestorage.app",
  messagingSenderId: "114212126454",
  appId: "1:114212126454:web:d01f7f2fd6cefce797f6d7"
};

const $ = id => document.getElementById(id);
if (firebaseConfig.apiKey.startsWith("PASTE")) $("setup").classList.remove("hidden");

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let signUp = false, unsubs = [];

$("swap").onclick = () => {
  signUp = !signUp;
  $("username").classList.toggle("hidden", !signUp);
  $("username").required = signUp;
  $("authBtn").textContent = signUp ? "Create account" : "Sign in";
  $("swapText").textContent = signUp ? "Already have an account?" : "New here?";
  $("swap").textContent = signUp ? "Sign in" : "Create an account";
  $("password").autocomplete = signUp ? "new-password" : "current-password";
  $("authErr").textContent = "";
};

$("authForm").onsubmit = async e => {
  e.preventDefault();
  $("authErr").textContent = "";
  try {
    const email = $("email").value.trim(), pw = $("password").value;
    if (signUp) {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: $("username").value.trim() });
      $("me").textContent = cred.user.displayName;
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  } catch (err) {
    const map = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/email-already-in-use": "That email already has an account. Sign in instead.",
      "auth/weak-password": "Use a password with at least 6 characters.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/operation-not-allowed": "Turn on Email/Password in Firebase Authentication.",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in the config is wrong."
    };
    $("authErr").textContent = map[err.code] || err.message;
  }
};

$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  $("auth").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (!user) return;
  $("me").textContent = user.displayName || user.email;
  listenRacers();
  listenChat(user);
  route();
});

/* ---------- pages ---------- */
function route() {
  const chat = location.hash === "#chat";
  $("statsView").classList.toggle("hidden", chat);
  $("chat").classList.toggle("hidden", !chat);
  $("navStats").setAttribute("aria-current", chat ? "false" : "page");
  $("navChat").setAttribute("aria-current", chat ? "page" : "false");
  if (chat) { const m = $("msgs"); m.scrollTop = m.scrollHeight; }
}
window.addEventListener("hashchange", route);
route();

/* ---------- racers (read from data.json, refreshed by GitHub every hour) ---------- */
let racers = [], carPics = {};
// key, title, how to sort, and which direction is "best first"
const COLS = [
  { k: "name", t: "Racer", get: r => (r.displayName || r.username || "").toLowerCase(), best: "asc", podium: false },
  { k: "avgSpeed", t: "Avg speed", get: r => r.avgSpeed, best: "desc" },
  { k: "highSpeed", t: "Highest speed", get: r => r.highSpeed, best: "desc" },
  { k: "lifetimeRaces", t: "Lifetime races", get: r => r.lifetimeRaces, best: "desc" },
  { k: "teamRaces", t: "Team races", get: r => r.teamRaces, best: "desc" },
  { k: "memberSince", t: "Member since", get: r => r.memberSince, best: "asc" },
  { k: "lastRace", t: "Last race", get: r => r.lastRace, best: "desc" }
];
let sortKey = "teamRaces", sortDir = "desc";

function agoTs(sec) {
  if (!sec) return "-";
  const diff = Math.max(0, Math.floor(Date.now() / 1000 - sec));
  const units = [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]];
  for (const [n, v] of units) if (diff >= v) { const k = Math.floor(diff / v); return k + " " + n + (k > 1 ? "s" : "") + " ago"; }
  return "just now";
}

function gainFrom(h) {
  const days = Object.keys(h || {}).sort();
  return days.length > 1 ? h[days[days.length - 1]] - h[days[days.length - 2]] : 0;
}

async function loadRacers() {
  try {
    const res = await fetch("data.json?t=" + Date.now());
    if (!res.ok) throw new Error("missing");
    const data = await res.json();
    carPics = data.cars || {};
    racers = data.racers.map(r => ({ ...r, gain: gainFrom(data.history?.[r.username]) }));
    await Promise.all(racers.map(carSrc));
    $("updated").textContent = "updated " + agoTs(data.updated) + " \u22C5 updates every hour";
  } catch { racers = []; $("updated").textContent = ""; }
  drawRacers();
}

function listenRacers() {
  loadRacers();
  const t = setInterval(loadRacers, 300000);
  unsubs.push(() => clearInterval(t));
}

// recolor a car picture the way Nitro Type does (true hue shift), saved so it only happens once
const tintCache = {}, imgCache = {};
const carKey = r => (r.carFile || "") + "|" + (r.carHue || 0);
function carSrc(r) {
  const key = carKey(r);
  if (tintCache[key]) return Promise.resolve(tintCache[key]);
  const dataUrl = carPics[r.carFile], hue = r.carHue || 0;
  if (!dataUrl) return Promise.resolve(null);
  return new Promise(done => {
    const src = new Image();
    src.onerror = () => done(null);
    src.onload = () => {
      const c = document.createElement("canvas"); c.width = src.naturalWidth; c.height = src.naturalHeight;
      const x = c.getContext("2d"); x.drawImage(src, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
      for (let i = 0; i < p.length; i += 4) {
        const r = p[i] / 255, g = p[i + 1] / 255, b = p[i + 2] / 255;
        const mx = Math.max(r, g, b), mn = Math.min(r, g, b), dl = mx - mn;
        if (dl === 0) continue;
        let h = mx === r ? ((g - b) / dl) % 6 : mx === g ? (b - r) / dl + 2 : (r - g) / dl + 4;
        h = (((h * 60 + hue) % 360) + 360) % 360;
        const k = mx * (dl / mx), xx = k * (1 - Math.abs((h / 60) % 2 - 1)), m = mx - k;
        let R, G, B;
        if (h < 60) { R = k; G = xx; B = 0; } else if (h < 120) { R = xx; G = k; B = 0; }
        else if (h < 180) { R = 0; G = k; B = xx; } else if (h < 240) { R = 0; G = xx; B = k; }
        else if (h < 300) { R = xx; G = 0; B = k; } else { R = k; G = 0; B = xx; }
        p[i] = Math.round((R + m) * 255); p[i + 1] = Math.round((G + m) * 255); p[i + 2] = Math.round((B + m) * 255);
      }
      x.putImageData(d, 0, 0);
      tintCache[key] = c.toDataURL();
      done(tintCache[key]);
    };
    src.src = dataUrl;
  });
}

// one picture element per racer, reused every time the table is redrawn (no flicker)
function carEl(r) {
  const key = carKey(r) + "|" + (r.carImage || "");
  const old = imgCache[r.username];
  if (old && old.dataset.key === key) return old;
  let el;
  const s = tintCache[carKey(r)] || r.carImage;
  if (s) {
    el = document.createElement("img"); el.alt = ""; el.className = "car";
    if (!tintCache[carKey(r)]) el.referrerPolicy = "no-referrer";
    el.onerror = () => { el.replaceWith(Object.assign(document.createElement("div"), { className: "car none", textContent: "no car" })); };
    el.src = s;
  } else { el = document.createElement("div"); el.className = "car none"; el.textContent = "no car"; }
  el.dataset.key = key; imgCache[r.username] = el;
  return el;
}

function cell(text, cls) { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text; return td; }
const num = v => (v == null || v === "" ? "-" : Number(v).toLocaleString());

function sortBy(k) {
  const col = COLS.find(c => c.k === k);
  if (sortKey === k) sortDir = sortDir === "asc" ? "desc" : "asc";
  else { sortKey = k; sortDir = col.best; }
  drawRacers();
}

function drawRacers() {
  const col = COLS.find(c => c.k === sortKey);
  const rows = racers.slice().sort((a, b) => {
    const x = col.get(a), y = col.get(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return sortDir === "asc" ? c : -c;
  });
  const showPodium = col.podium !== false && sortDir === col.best;
  const box = $("racers"); box.textContent = "";
  if (!rows.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "Racer stats are not loaded yet. They appear after the first automatic update finishes."; box.append(p); return; }

  const table = document.createElement("table");
  const thead = document.createElement("thead"), head = document.createElement("tr");
  COLS.forEach(c => {
    const th = document.createElement("th"), b = document.createElement("button");
    b.type = "button"; b.textContent = c.t;
    if (c.k === sortKey) {
      th.setAttribute("aria-sort", sortDir === "asc" ? "ascending" : "descending");
      const a = document.createElement("span"); a.className = "arrow"; a.textContent = sortDir === "asc" ? "\u25B2" : "\u25BC"; a.setAttribute("aria-hidden", "true"); b.append(a);
    }
    b.onclick = () => sortBy(c.k);
    th.append(b); head.append(th);
  });
  thead.append(head); table.append(thead);

  const tbody = document.createElement("tbody");
  rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    const who = document.createElement("td"); who.className = "first";
    const role = (r.role || "").toLowerCase();
    if (role === "officer" || role === "captain") {
      const tag = document.createElement("div"); tag.className = "tag " + role; tag.textContent = role; who.append(tag);
    }
    const wrap = document.createElement("div"); wrap.className = "who-cell";
    const car = carEl(r);
    const names = document.createElement("div");
    const u = document.createElement("div"); u.className = "uname" + (r.membership === "gold" ? " gold" : "");
    if (showPodium && i < 3) { const p = document.createElement("span"); p.className = "place p" + (i + 1); p.textContent = ["1st", "2nd", "3rd"][i]; u.append(p); }
    if (r.membership === "gold") { const n = document.createElement("span"); n.className = "nt"; n.textContent = "N"; n.title = "Nitro Gold"; u.append(n); }
    const link = document.createElement("a"); link.href = "https://www.nitrotype.com/racer/" + encodeURIComponent(r.username); link.target = "_blank"; link.rel = "noopener"; link.textContent = r.displayName || r.username; u.append(link);
    const c = document.createElement("div"); c.className = "sub"; c.textContent = r.title ? "\u201C" + r.title + "\u201D" : "";
    names.append(u, c); wrap.append(car, names); who.append(wrap);
    const team = cell(num(r.teamRaces));
    if (r.gain) { const g = document.createElement("div"); g.className = "gain"; g.textContent = "+" + r.gain.toLocaleString() + " since yesterday"; team.append(g); }
    tr.append(who, cell(r.avgSpeed ?? "-"), cell(r.highSpeed ?? "-"), cell(num(r.lifetimeRaces)), team, cell(agoTs(r.memberSince)), cell(agoTs(r.lastRace)));
    tbody.append(tr);
  });
  table.append(tbody);
  box.append(table);
}

/* ---------- chat ---------- */
function listenChat(user) {
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubs.push(onSnapshot(q, snap => {
    const box = $("msgs");
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = "";
    snap.docs.slice().reverse().forEach(d => {
      const m = d.data();
      const el = document.createElement("div"); el.className = "msg" + (m.uid === user.uid ? " me" : "");
      const b = document.createElement("b"); b.textContent = m.name || "Racer";
      const t = document.createElement("time");
      if (m.createdAt) t.textContent = m.createdAt.toDate().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const p = document.createElement("p"); p.textContent = m.text;
      el.append(b, t, p); box.append(el);
    });
    if (stick) box.scrollTop = box.scrollHeight;
  }));
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  const u = auth.currentUser;
  await addDoc(collection(db, "messages"), { text, uid: u.uid, name: u.displayName || u.email, createdAt: serverTimestamp() });
};
</script>
</body>
</html>
