<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Pit Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101828;--mute:#667085;--paper:#F5F6FA;--card:#fff;--line:#E3E6EE;--blue:#2F5BFF;--gold:#F5B301;--green:#12805C;--red:#C0362C}
@media (prefers-color-scheme:dark){:root{--ink:#EEF1F8;--mute:#98A2B3;--paper:#0E1320;--card:#161C2C;--line:#262E44;--blue:#6C8BFF;--gold:#F5B301;--green:#4CC9A0;--red:#FF8077}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.banner{background:var(--gold);color:#101828;padding:10px 16px;font-weight:600;text-align:center}
/* auth */
.auth{min-height:100%;display:grid;place-items:center;padding:24px}
.auth-box{width:100%;max-width:380px}
.auth h1{font-size:44px;line-height:1.05;margin:0 0 8px;font-weight:800;letter-spacing:-.03em}
.auth p{color:var(--mute);margin:0 0 24px}
form.stack{display:grid;gap:12px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn{border:0;background:var(--blue);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.link{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:600}
.err{color:var(--red);min-height:1.4em;margin:0;font-size:14px}
/* app */
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
header h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
header .who{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:14px}
main{display:grid;gap:24px;padding:24px;max-width:1200px;margin:0 auto}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.head h3{margin:0;font-size:16px}
.head .tools{display:flex;gap:8px;align-items:center}
select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.scroll{overflow:auto;flex:1;min-height:0}
/* racers table */
table{width:100%;border-collapse:collapse;min-width:860px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.who-cell{display:flex;align-items:center;gap:12px}
.car{width:84px;height:36px;object-fit:contain;flex:none}
.car.none{display:grid;place-items:center;color:var(--mute);font-size:12px;border:1px dashed var(--line);border-radius:8px}
.uname{font-weight:800}
.uname a{color:inherit;text-decoration:none}.uname a:hover{text-decoration:underline}
.sub{color:var(--mute);font-size:12px}
.gain{color:var(--green);font-size:12px;font-weight:600}
.first .uname::before{content:"1st";background:var(--gold);color:#101828;border-radius:6px;padding:1px 6px;margin-right:8px;font-size:12px}
.empty{padding:28px 20px;color:var(--mute)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:24px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h3{margin:0 0 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
.span2{grid-column:1/3}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* chat */
#chat{height:420px}
.msg{padding:8px 20px}
.msg b{font-size:13px}
.msg time{color:var(--mute);font-size:12px;margin-left:6px}
.msg p{margin:2px 0 0;overflow-wrap:anywhere}
.msg.me b{color:var(--blue)}
.send{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="setup" class="banner hidden">Paste your Firebase apiKey into the firebaseConfig near the bottom of this file.</div>

<div id="auth" class="auth hidden">
  <div class="auth-box">
    <h1>Team Pit Stop</h1>
    <p>Chat with your team and see who is racing the most.</p>
    <form id="authForm" class="stack">
      <input id="username" placeholder="Nitro Type username" autocomplete="nickname" class="hidden">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" minlength="6" required>
      <p class="err" id="authErr" role="alert"></p>
      <button class="btn" id="authBtn" type="submit">Sign in</button>
    </form>
    <p style="margin-top:16px"><span id="swapText">New here?</span> <button class="link" id="swap" type="button">Create an account</button></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h2>Team Pit Stop</h2>
    <div class="who"><span id="me"></span><button class="btn ghost" id="out">Sign out</button></div>
  </header>
  <main>
    <section>
      <div class="head">
        <h3>Team racers</h3>
        <div class="tools">
          <select id="sort" aria-label="Sort racers">
            <option value="team">Most team races</option>
            <option value="gain">Biggest gain</option>
            <option value="life">Most lifetime races</option>
            <option value="avg">Highest average speed</option>
            <option value="high">Highest top speed</option>
          </select>
          <button class="btn" id="addBtn">Add racer</button>
        </div>
      </div>
      <div class="scroll" id="racers"></div>
    </section>
    <section id="chat">
      <div class="head"><h3>Team chat</h3></div>
      <div class="scroll" id="msgs"></div>
      <form class="send" id="sendForm">
        <input id="text" placeholder="Write a message" maxlength="500" autocomplete="off" required>
        <button class="btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <dialog id="dlg">
    <form id="racerForm">
      <h3 id="dlgTitle">Add racer</h3>
      <div class="grid2">
        <label class="span2">Username<input id="f_name" required></label>
        <label class="span2">Car name<input id="f_car" placeholder="Example: Yellow Lamborghini"></label>
        <label class="span2">Car picture link (optional)<input id="f_img" type="url" placeholder="Right-click the car on Nitro Type, copy image address"></label>
        <label>Average speed (WPM)<input id="f_avg" type="number" min="0"></label>
        <label>Highest speed (WPM)<input id="f_high" type="number" min="0"></label>
        <label>Lifetime races<input id="f_life" type="number" min="0"></label>
        <label>Team races<input id="f_team" type="number" min="0"></label>
        <label>Member since<input id="f_since" type="date"></label>
        <label>Last race<input id="f_last" type="date"></label>
      </div>
      <div class="actions">
        <button class="btn ghost" type="button" id="cancel">Cancel</button>
        <button class="btn" type="submit">Save racer</button>
      </div>
    </form>
  </dialog>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDj-UlpMjTVccy4RfWqP8-Lyt_2HOFs4lc",
  authDomain: "nitrotype2b.firebaseapp.com",
  projectId: "nitrotype2b",
  storageBucket: "nitrotype2b.firebasestorage.app",
  messagingSenderId: "114212126454",
  appId: "1:114212126454:web:d01f7f2fd6cefce797f6d7"
};

const $ = id => document.getElementById(id);
if (firebaseConfig.apiKey.startsWith("PASTE")) $("setup").classList.remove("hidden");

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let signUp = false, unsubs = [];

$("swap").onclick = () => {
  signUp = !signUp;
  $("username").classList.toggle("hidden", !signUp);
  $("username").required = signUp;
  $("authBtn").textContent = signUp ? "Create account" : "Sign in";
  $("swapText").textContent = signUp ? "Already have an account?" : "New here?";
  $("swap").textContent = signUp ? "Sign in" : "Create an account";
  $("password").autocomplete = signUp ? "new-password" : "current-password";
  $("authErr").textContent = "";
};

$("authForm").onsubmit = async e => {
  e.preventDefault();
  $("authErr").textContent = "";
  try {
    const email = $("email").value.trim(), pw = $("password").value;
    if (signUp) {
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: $("username").value.trim() });
      $("me").textContent = cred.user.displayName;
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  } catch (err) {
    const map = {
      "auth/invalid-credential": "Wrong email or password.",
      "auth/email-already-in-use": "That email already has an account. Sign in instead.",
      "auth/weak-password": "Use a password with at least 6 characters.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/operation-not-allowed": "Turn on Email/Password in Firebase Authentication.",
      "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "The apiKey in the config is wrong."
    };
    $("authErr").textContent = map[err.code] || err.message;
  }
};

$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  $("auth").classList.toggle("hidden", !!user);
  $("app").classList.toggle("hidden", !user);
  if (!user) return;
  $("me").textContent = user.displayName || user.email;
  listenRacers();
  listenChat(user);
});

/* ---------- racers ---------- */
const today = () => new Date().toISOString().slice(0, 10);
let racers = [], editing = null;

function ago(d) {
  if (!d) return "-";
  const days = Math.round((new Date(today()) - new Date(d)) / 864e5);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  if (days < 365) return Math.floor(days / 30) + (days < 60 ? " month ago" : " months ago");
  return Math.floor(days / 365) + (days < 730 ? " year ago" : " years ago");
}

function gainOf(r) {
  const days = Object.keys(r.history || {}).sort();
  return days.length > 1 ? r.history[days[days.length - 1]] - r.history[days[days.length - 2]] : 0;
}

function listenRacers() {
  unsubs.push(onSnapshot(collection(db, "racers"), snap => {
    racers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    racers.forEach(r => r.gain = gainOf(r));
    drawRacers();
  }));
}

function cell(text, cls) { const td = document.createElement("td"); if (cls) td.className = cls; td.textContent = text; return td; }

function drawRacers() {
  const key = { team: "teamRaces", gain: "gain", life: "lifetimeRaces", avg: "avgSpeed", high: "highSpeed" }[$("sort").value];
  const rows = racers.slice().sort((a, b) => (b[key] || 0) - (a[key] || 0));
  const box = $("racers"); box.textContent = "";
  if (!rows.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No racers yet. Click Add racer to start your team list."; box.append(p); return; }
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["Racer", "Avg speed", "Highest speed", "Lifetime races", "Team races", "Member since", "Last race", ""].forEach(h => { const th = document.createElement("th"); th.textContent = h; head.append(th); });
  table.append(head);
  rows.forEach((r, i) => {
    const tr = document.createElement("tr"); if (i === 0) tr.className = "first";
    const who = document.createElement("td"), wrap = document.createElement("div"); wrap.className = "who-cell";
    let car;
    if (r.carImage) { car = document.createElement("img"); car.src = r.carImage; car.alt = r.car || "Car"; car.className = "car"; car.onerror = () => car.remove(); }
    else { car = document.createElement("div"); car.className = "car none"; car.textContent = "no car"; }
    const names = document.createElement("div");
    const u = document.createElement("div"); u.className = "uname";
    const link = document.createElement("a"); link.href = "https://www.nitrotype.com/racer/" + encodeURIComponent(r.name); link.target = "_blank"; link.rel = "noopener"; link.textContent = r.name; u.append(link);
    const c = document.createElement("div"); c.className = "sub"; c.textContent = r.car || "";
    names.append(u, c); wrap.append(car, names); who.append(wrap);
    const team = cell((r.teamRaces ?? 0).toLocaleString());
    if (r.gain) { const g = document.createElement("div"); g.className = "gain"; g.textContent = "+" + r.gain.toLocaleString() + " since last update"; team.append(g); }
    const since = cell(ago(r.memberSince)), last = cell(ago(r.lastRace));
    since.title = r.memberSince || ""; last.title = r.lastRace || "";
    const act = document.createElement("td"), eb = document.createElement("button"); eb.className = "btn ghost"; eb.textContent = "Edit"; eb.onclick = () => openDlg(r); act.append(eb);
    tr.append(who, cell(r.avgSpeed ?? "-"), cell(r.highSpeed ?? "-"), cell((r.lifetimeRaces ?? 0).toLocaleString()), team, since, last, act);
    table.append(tr);
  });
  box.append(table);
}

$("sort").onchange = drawRacers;

function openDlg(r) {
  editing = r || null;
  $("dlgTitle").textContent = r ? "Edit " + r.name : "Add racer";
  $("f_name").value = r?.name || ""; $("f_car").value = r?.car || ""; $("f_img").value = r?.carImage || "";
  $("f_avg").value = r?.avgSpeed ?? ""; $("f_high").value = r?.highSpeed ?? "";
  $("f_life").value = r?.lifetimeRaces ?? ""; $("f_team").value = r?.teamRaces ?? "";
  $("f_since").value = r?.memberSince || ""; $("f_last").value = r?.lastRace || "";
  $("dlg").showModal();
}
$("addBtn").onclick = () => openDlg(null);
$("cancel").onclick = () => $("dlg").close();

$("racerForm").onsubmit = async e => {
  e.preventDefault();
  const num = id => $(id).value === "" ? null : Number($(id).value);
  const data = {
    name: $("f_name").value.trim(), car: $("f_car").value.trim(), carImage: $("f_img").value.trim(),
    avgSpeed: num("f_avg"), highSpeed: num("f_high"), lifetimeRaces: num("f_life"), teamRaces: num("f_team"),
    memberSince: $("f_since").value, lastRace: $("f_last").value, updatedAt: serverTimestamp()
  };
  if (data.teamRaces !== null) data.history = { [today()]: data.teamRaces };
  if (editing) await setDoc(doc(db, "racers", editing.id), data, { merge: true });
  else await addDoc(collection(db, "racers"), { ...data, createdAt: serverTimestamp() });
  $("dlg").close();
};

/* ---------- chat ---------- */
function listenChat(user) {
  const q = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(100));
  unsubs.push(onSnapshot(q, snap => {
    const box = $("msgs");
    const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
    box.textContent = "";
    snap.docs.slice().reverse().forEach(d => {
      const m = d.data();
      const el = document.createElement("div"); el.className = "msg" + (m.uid === user.uid ? " me" : "");
      const b = document.createElement("b"); b.textContent = m.name || "Racer";
      const t = document.createElement("time");
      if (m.createdAt) t.textContent = m.createdAt.toDate().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      const p = document.createElement("p"); p.textContent = m.text;
      el.append(b, t, p); box.append(el);
    });
    if (stick) box.scrollTop = box.scrollHeight;
  }));
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  const u = auth.currentUser;
  await addDoc(collection(db, "messages"), { text, uid: u.uid, name: u.displayName || u.email, createdAt: serverTimestamp() });
};
</script>
</body>
</html>
